server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir el build de Angular; cualquier ruta desconocida vuelve a
    # index.html para que el router de Angular la resuelva (SPA).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API hacia el backend NestJS dentro de la red de Docker.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagenes de propiedades subidas al backend.
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
